name: Generate Snake Contribution

on:
  schedule:
    - cron: "0 0 * * *"  # Every day at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # ensures all branches are fetched

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: SrikanthBommadi
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Ensure output branch exists
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -B output || git checkout --orphan output
          git add dist/
          git commit -m "Update snake contribution graph" || echo "No changes to commit"
          git push -u origin output --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
